name: CI

# Every PR: install + typecheck + build (required to merge into main).
# Every push to main: same build, then deploy dist/ to GitHub Pages and push it to itch.io.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Uploads the same build to itch.io with butler. The itch page must already exist (create it on
  # itch.io first); BUTLER_API_KEY is a repo secret. Pause uploads with the repo variable
  # ITCH_DEPLOY=off (`gh variable set ITCH_DEPLOY --body off`); set it to on to resume.
  itch:
    if: github.event_name == 'push' && vars.ITCH_DEPLOY != 'off'
    needs: build
    runs-on: ubuntu-latest
    env:
      ITCH_TARGET: gravity006/echoes-of-sorrow:html5
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist
      - run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          butler/butler -V
          butler/butler push dist "$ITCH_TARGET" --userversion "${GITHUB_SHA::7}"
